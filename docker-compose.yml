version: '3.8'

services:
  metrolog-manage:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      # Persistent cache for nginx proxy
      - nginx-cache:/var/cache/nginx
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.22.11
    container_name: pocketbase
    ports:
      - "8090:80"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  nginx-cache:
    driver: local
  pb_data:
    driver: local
